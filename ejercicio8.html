
<!DOCTYPE html>
<html>

    <head>
        <title>ejercicio8</title>
    </head>
    <body>
        <div>
            <!-- 1. ¿Qué es un div? -->
            <!--
                Un div es un elemento genérico de bloque en HTML.
                Sirve para agrupar elementos y aplicarles estilos o scripts.
            -->
            <h1>Titulo</h1>
            <p>Parrafo</p>
            <a href="#">Enlace</a>
            <img src="" alt="">
            <button>Boton</button>
        </div>
        <div>
            <!-- 2. Múltiples div -->
            <!--
                Hemos creado múltiples div para demostrar que se pueden usar para agrupar
                diferentes elementos y aplicarles estilos o scripts de forma independiente.
            -->
        </div>
        <div>
            <!-- 3. ¿Cuándo se debe usar? -->
            <!--
                Se recomienda usar div para:
                - Agrupar elementos relacionados
                - Aplicar estilos o scripts a un grupo de elementos
                - Crear layouts o secciones de una página
                - Separar contenido de diferentes tipos
            -->
        </div>
        <div>
            <!-- 4. Ejemplos prácticos -->
            <!--
                Aquí tienes ejemplos de cómo se pueden usar div:
            -->
            <div>
                <h2>Seccion 1</h2>
                <p>Contenido de la sección 1</p>
            </div>
            <div>
                <h2>Seccion 2</h2>
                <p>Contenido de la sección 2</p>
            </div>
        </div>
    </body>

</html>
